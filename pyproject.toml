[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reefberry"
version = "0.2.1"
description = "A reef aquarium dashboard for the Raspberry Pi: Kasa power control, water parameters, ICP dosing and pH/ORP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "python-kasa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
reefberry = "reefberry.__main__:main"

[tool.setuptools.packages.find]
include = ["reefberry*"]

[tool.setuptools.package-data]
reefberry = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
