{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}narrow{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Sign in</h1>
  <p class="muted">to {{ tank_name }}</p>
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
